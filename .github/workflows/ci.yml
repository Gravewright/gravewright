name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Shared test-server env for the app boot / e2e steps.
env:
  PUBLIC_BASE_URL: http://testserver.local
  ALLOWED_HOSTS: testserver.local,localhost,127.0.0.1
  WS_ALLOWED_ORIGINS: http://testserver.local,http://localhost,http://127.0.0.1
  SESSION_COOKIE_SECURE: "false"
  # Test databases are isolated under pytest's temporary directory. This is
  # the only file-backed context allowed to use metadata.create_all().
  ALLOW_METADATA_BOOTSTRAP: "true"

jobs:
  # --- required: fast lint gate ------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install
      - run: uv sync --frozen --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .

  # --- required: fast unit + compile + e2e ------------------------------------
  unit:
    name: Unit + e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install
      - run: uv sync --frozen
      - name: Compile Python files
        run: uv run python -m compileall app tests scripts main.py migrations
      - name: Check generated SDK reference docs
        run: uv run python scripts/generate_sdk_reference.py --check
      - name: Validate example packages
        run: uv run python -m app.cli package validate examples/packages
      - name: Unit tests
        run: uv run pytest tests/unit --junitxml=unit-results.xml
      - name: End-to-end tests
        run: uv run pytest tests/e2e --junitxml=e2e-results.xml
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: "*-results.xml"   # test names/timings only — no secrets/payloads
          if-no-files-found: ignore

  # --- required: schema is reproducible from migrations (SQLite) --------------
  schema:
    name: Schema audit (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install
      - run: uv sync --frozen
      - name: Empty DB -> alembic upgrade head -> status
        run: |
          uv run python -m app.cli db upgrade
          uv run python -m app.cli db status
      - name: Schema parity, legacy upgrade, startup and enum-constraint tests
        run: >
          uv run pytest
          tests/unit/test_schema_alembic_parity.py
          tests/unit/test_schema_legacy_upgrade.py
          tests/unit/test_schema_startup.py
          tests/unit/test_schema_metadata_parity.py
          tests/unit/test_schema_migrations.py
          tests/unit/test_enum_constraints.py
          -q

  # --- required: PostgreSQL backend + full migration chain --------------------
  postgres:
    name: PostgreSQL (migrations + backend smoke)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gravewright
          POSTGRES_PASSWORD: gravewright
          POSTGRES_DB: gravewright_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gravewright"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gravewright:gravewright@localhost:5432/gravewright_test
      GRAVEWRIGHT_TEST_DATABASE_URLS: postgresql+psycopg://gravewright:gravewright@localhost:5432/gravewright_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install
      - run: uv sync --frozen --extra postgres --extra dev
      - name: Full migration chain on PostgreSQL
        run: |
          uv run alembic upgrade head
          uv run python -m app.cli db status
      - name: Backend repository/upsert smoke on PostgreSQL
        run: uv run pytest tests/integration -q

  # --- required: validate every Compose file used by the project --------------
  compose:
    name: Compose config (perf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose files
        run: |
          docker compose -f docker-compose.yml config
          for file in tests/docker-compose*.yml; do
            docker compose -f "$file" config
          done
