[project]
name = "Gravewright"
version = "1.0.0b3"
description = "Gravewright is an open-source virtual tabletop platform for tabletop RPGs, built with a focus on performance, extensibility, and full control over the gameplay experience."
requires-python = ">=3.11"
dependencies = [
  "alembic==1.19.1",
  "litestar[jinja]==2.22.0",
  "pillow==12.3.0",
  "pyvips[binary]==3.1.1",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
  "xdice==1.2.1",
]

[project.optional-dependencies]
dev = [
    "questionary==2.1.1",
    "rich==15.0.0",
    "ruff==0.16.2",
]
postgres = ["psycopg[binary]==3.3.4"]

[project.scripts]
grave = "app.cli:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# High-signal pyflakes rules (unused imports, undefined names, f-string bugs).
# The E402 "import not at top" pattern is intentional here (env setup precedes
# imports in main/config/conftest), so the broader pycodestyle set is not
# selected. `ruff format` is not yet enforced repo-wide (large reformat pending).
select = ["F"]

[dependency-groups]
dev = [
    "playwright==1.62.0",
    "pyinstaller==6.22.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
