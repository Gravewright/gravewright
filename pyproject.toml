[project]
name = "Gravewright"
version = "1.0.0b1"
description = "Gravewright is an open-source virtual tabletop platform for tabletop RPGs, built with a focus on performance, extensibility, and full control over the gameplay experience."
requires-python = ">=3.11"
dependencies = [
  "alembic==1.18.4",
  "litestar[jinja]==2.22.0",
  "pillow==12.3.0",
  "pyside6>=6.11.1",
  "pyvips[binary]>=3.1.1",
  "sqlalchemy==2.0.50",
  "uvicorn[standard]==0.47.0",
  "xdice==1.2.1",
]

[project.optional-dependencies]
dev = [
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "ruff==0.15.14",
]
postgres = ["psycopg[binary]==3.3.4"]

[project.scripts]
grave = "app.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# High-signal pyflakes rules (unused imports, undefined names, f-string bugs).
# The E402 "import not at top" pattern is intentional here (env setup precedes
# imports in main/config/conftest), so the broader pycodestyle set is not
# selected. `ruff format` is not yet enforced repo-wide (large reformat pending).
select = ["F"]

[dependency-groups]
dev = [
    "playwright==1.62.0",
    "pyinstaller==6.21.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
]
