<div class="sw-html-sheet" data-swade-character>
  <header class="sw-sheet-head">
    <div class="sw-identity">
      <input class="sw-name" data-bind="actor.name" placeholder="Nome" />
      <div class="sw-meta">
        <label><span>Ancestralidade</span><input data-bind="system.ancestry" /></label>
        <label><span>Conceito</span><input data-bind="system.concept" /></label>
        <label><span>Estágio</span><select data-bind="system.rank"><option value="novice">Novato</option><option value="seasoned">Experiente</option><option value="veteran">Veterano</option><option value="heroic">Heroico</option><option value="legendary">Lendário</option></select></label>
        <label><span>Avanços</span><input type="number" data-bind="system.advances" /></label>
      </div>
      <div class="sw-vitals sw-vitals--primary">
        <fieldset class="sw-track"><legend data-sw-i18n="savage-worlds.ui.estado">Estado</legend><div class="sw-track-row"><span data-sw-i18n="savage-worlds.ui.ferimentos">Ferimentos</span><div class="sw-pips" data-sw-pips="wounds"></div></div><div class="sw-track-row"><span data-sw-i18n="savage-worlds.ui.fadiga">Fadiga</span><div class="sw-pips" data-sw-pips="fatigue"></div></div><div class="sw-track-actions"><button class="sw-conditions-trigger" type="button" data-sw-open-conditions aria-haspopup="dialog"><i class="ph ph-activity" aria-hidden="true"></i><span data-sw-i18n="savage-worlds.ui.condicoes">Condições</span></button><button class="sw-natural-healing" type="button" data-action="roll.natural-healing" title="Cura natural"><i class="ph ph-first-aid" aria-hidden="true"></i></button></div></fieldset>
        <fieldset class="sw-derived-strip"><legend data-sw-i18n="savage-worlds.ui.derivados">Derivados</legend><div class="sw-derived"><div data-sw-stat="parry"><i class="ph ph-shield" aria-hidden="true"></i><small data-sw-i18n="savage-worlds.ui.parry">Aparar</small><b data-text="system.stats.parry.value"></b><em data-sw-why="parry"></em></div><div data-sw-stat="toughness"><i class="ph ph-heartbeat" aria-hidden="true"></i><small data-sw-i18n="savage-worlds.ui.toughness">Resistência</small><b data-text="system.stats.toughness.value"></b><em data-sw-why="toughness"></em></div><div data-sw-stat="pace" class="sw-derived--rollable" data-action="roll.running" role="button" tabindex="0" title="Corrida"><i class="ph ph-boot" aria-hidden="true"></i><small data-sw-i18n="savage-worlds.ui.pace">Movimentação</small><b data-text="system.stats.pace.value"></b><em data-sw-why="pace"></em></div><div data-sw-stat="load"><i class="ph ph-barbell" aria-hidden="true"></i><small data-sw-i18n="savage-worlds.ui.sobrecarga">Sobrecarga</small><b data-text="system.stats.load.encumbrance"></b><em data-sw-why="load"></em></div></div></fieldset>
        <fieldset class="sw-bennies"><legend data-sw-i18n="savage-worlds.ui.bennies">Benes</legend><div class="sw-bennies-control"><button type="button" data-sw-benny-step="-1" aria-label="Gastar Bene">−</button><div class="sw-bennies-coin" aria-hidden="true"><i class="ph ph-coin"></i></div><button type="button" data-sw-benny-step="1" aria-label="Ganhar Bene">+</button><div class="sw-bennies-values"><label><span data-sw-i18n="savage-worlds.ui.atual">Atual</span><input type="number" min="0" readonly data-bind="system.bennies.value" /></label><span aria-hidden="true">/</span><label><span data-sw-i18n="savage-worlds.ui.max.abbr">Máx.</span><input type="number" min="0" readonly data-bind="system.bennies.max" /></label></div></div></fieldset>
      </div>
    </div>
    <div class="sw-image sw-image--token" data-actor-image="token"></div>
  </header>

  <input type="hidden" data-bind="system.penalty.total" />

  <dialog class="sw-conditions-dialog" data-sw-conditions-dialog aria-labelledby="sw-conditions-title"><header><div><small data-sw-i18n="savage-worlds.ui.estado">Estado</small><h2 id="sw-conditions-title" data-sw-i18n="savage-worlds.ui.condicoes">Condições</h2></div><button type="button" data-sw-close-conditions aria-label="Fechar"><i class="ph ph-x" aria-hidden="true"></i></button></header><div class="sw-conditions"><div class="sw-cond-grid"><label class="sw-cond sw-cond--negative"><input type="checkbox" data-bind="system.conditions.shaken" /><span data-sw-i18n="savage-worlds.cond.abalado">Abalado</span></label><label class="sw-cond sw-cond--negative" data-sw-cost="−2"><input type="checkbox" data-bind="system.conditions.distracted" /><span data-sw-i18n="savage-worlds.cond.distraido">Distraído</span></label><label class="sw-cond sw-cond--negative"><input type="checkbox" data-bind="system.conditions.vulnerable" /><span data-sw-i18n="savage-worlds.cond.vulneravel">Vulnerável</span></label><label class="sw-cond sw-cond--negative"><input type="checkbox" data-bind="system.conditions.stunned" /><span data-sw-i18n="savage-worlds.cond.atordoado">Atordoado</span></label><label class="sw-cond sw-cond--negative"><input type="checkbox" data-bind="system.conditions.entangled" /><span data-sw-i18n="savage-worlds.cond.enredado">Enredado</span></label><label class="sw-cond sw-cond--negative"><input type="checkbox" data-bind="system.conditions.bound" /><span data-sw-i18n="savage-worlds.cond.imobilizado">Imobilizado</span></label><label class="sw-cond sw-cond--negative" data-sw-cost="−2"><input type="checkbox" data-bind="system.conditions.prone" /><span data-sw-i18n="savage-worlds.cond.caido">Caído</span></label><label class="sw-cond sw-cond--negative"><input type="checkbox" data-bind="system.conditions.encumbered" /><span data-sw-i18n="savage-worlds.cond.sobrecarregado">Sobrecarregado</span></label><label class="sw-cond sw-cond--negative"><input type="checkbox" data-bind="system.conditions.fatigued" /><span data-sw-i18n="savage-worlds.cond.fatigado">Fatigado</span></label><label class="sw-cond sw-cond--negative"><input type="checkbox" data-bind="system.conditions.incapacitated" /><span data-sw-i18n="savage-worlds.cond.incapacitado">Incapacitado</span></label><label class="sw-cond sw-cond--positive"><input type="checkbox" data-bind="system.conditions.holding" /><span data-sw-i18n="savage-worlds.cond.esperando">Esperando</span></label><label class="sw-cond sw-cond--positive" data-sw-cost="+2"><input type="checkbox" data-bind="system.conditions.aiming" /><span data-sw-i18n="savage-worlds.cond.mirando">Mirando</span></label><label class="sw-cond sw-cond--positive" data-sw-cost="+4"><input type="checkbox" data-bind="system.conditions.defending" /><span data-sw-i18n="savage-worlds.cond.defendendo">Defendendo</span></label></div></div></dialog>

  <nav class="sw-tabs" role="tablist" aria-label="Ficha">
    <button type="button" data-tab="summary" data-sw-i18n="savage-worlds.ui.principal">Principal</button>
    <button type="button" data-tab="edges">Vantagens</button>
    <button type="button" data-tab="inventory">Inventário</button>
    <button type="button" data-tab="powers">Poderes</button>
    <button type="button" data-tab="about">Sobre</button>
  </nav>

  <section class="sw-panel" data-tab-panel="summary">
    <div class="sw-summary-grid">
      <div class="sw-summary-column"><section class="sw-card sw-attributes-card"><div class="sw-card-heading"><h2>Atributos</h2><button type="button" data-sw-edit-attributes>Editar</button></div><div data-sw-attribute-cards></div></section><section class="sw-card sw-shortcuts"><h2 data-sw-i18n="savage-worlds.ui.atalhos">Atalhos</h2><div data-sw-weapon-shortcuts></div></section></div>
      <section class="sw-card sw-skills sw-traits-like"><h2>Perícias</h2><div class="sw-skill-table-head"><span data-sw-i18n="savage-worlds.ui.pericia">Perícia</span><span data-sw-i18n="savage-worlds.ui.atributo">Atributo</span><span data-sw-i18n="savage-worlds.ui.dado">Dado</span><span data-sw-i18n="savage-worlds.ui.modificador">Mod.</span><span></span></div><div class="sw-skill-rows" data-sw-skill-rows></div><div class="sw-skill-drop" data-empty-text="Arraste uma perícia para adicionar"><span>Arraste uma perícia para adicionar</span></div></section>
    </div>
  </section>

  <section class="sw-panel sw-two" data-tab-panel="edges" hidden><section class="sw-card"><h2>Vantagens</h2><div data-item-list="system.edges" data-empty-text="Arraste uma vantagem para a ficha" data-item-actions='[{"action": "item.describe.edge", "label": "Mostrar", "labelKey": "savage-worlds.ui.mostrar"}]'></div></section><section class="sw-card"><h2>Complicações</h2><div data-item-list="system.hindrances" data-empty-text="Arraste uma complicação para a ficha" data-item-actions='[{"action": "item.describe.hindrance", "label": "Mostrar", "labelKey": "savage-worlds.ui.mostrar"}]'></div></section></section>
  <section class="sw-panel" data-tab-panel="inventory" hidden><div class="sw-inventory-grid"><section class="sw-card"><h2 data-sw-i18n="savage-worlds.ui.armas">Armas</h2><div data-item-list="system.weapons" data-item-actions='[{"action": "item.describe", "label": "Mostrar", "labelKey": "savage-worlds.ui.mostrar"}]' data-empty-text="Arraste uma arma para a ficha"></div></section><section class="sw-card"><h2>Proteção</h2><div data-item-list="system.protection" data-empty-text="Arraste armadura ou escudo para a ficha" data-item-actions='[{"action": "item.describe", "label": "Mostrar", "labelKey": "savage-worlds.ui.mostrar"}]'></div></section><section class="sw-card"><h2>Equipamento</h2><div data-item-list="system.gear" data-empty-text="Arraste equipamento para a ficha" data-item-actions='[{"action": "item.describe", "label": "Mostrar", "labelKey": "savage-worlds.ui.mostrar"}]'></div></section><section class="sw-card sw-load-card"><h2>Carga</h2><div><label>Atual<input type="number" data-bind="system.stats.load.value" /></label><label data-sw-i18n-title="savage-worlds.ui.carga"><span>Máxima</span><output class="sw-readonly" data-text="system.stats.load.max">0</output></label><label><span data-sw-i18n="savage-worlds.ui.sobrecarga">Sobrecarga</span><output class="sw-readonly" data-text="system.stats.load.encumbrance">0</output></label></div></section></div></section>
  <section class="sw-panel" data-tab-panel="powers" hidden><div class="sw-power-head"><label>Antecedente Arcano<input data-bind="system.power.arcane" /></label><label>Perícia<input data-bind="system.power.skill" /></label><label>Pontos<input type="number" data-bind="system.power.points.value" /></label><label>Máx.<input type="number" data-bind="system.power.points.max" /></label></div><section class="sw-card"><h2>Poderes</h2><div data-item-list="system.powers" data-empty-text="Arraste um poder para a ficha" data-item-actions='[{"action": "item.describe", "label": "Mostrar", "labelKey": "savage-worlds.ui.mostrar"}]'></div></section></section>
  <section class="sw-panel sw-about" data-tab-panel="about" hidden><section class="sw-card"><h2>História</h2><div data-rich-editor="system.bio"></div></section><section class="sw-card"><h2>Anotações</h2><div data-rich-editor="system.notes"></div></section></section>
</div>
