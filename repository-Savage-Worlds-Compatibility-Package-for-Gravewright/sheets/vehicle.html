<div class="sw-html-sheet sw-html-sheet--vehicle" data-sheet-type="vehicle">
  <header class="sw-sheet-head"><div class="sw-identity"><input class="sw-name" data-bind="actor.name" placeholder="Nome do veículo" /><div class="sw-meta sw-meta--vehicle"><label><span>Conceito</span><input data-bind="system.concept" /></label><label><span>Velocidade máxima</span><input data-bind="system.topSpeed" /></label><label><span>Manobra</span><input type="number" data-bind="system.handling" /></label></div></div><div class="sw-image sw-image--token" data-actor-image="token"></div></header>
  <nav class="sw-tabs" role="tablist"><button type="button" data-tab="summary">Principal</button><button type="button" data-tab="notes">Anotações</button></nav>
  <section class="sw-panel" data-tab-panel="summary"><div class="sw-vehicle-dashboard"><fieldset class="sw-counter sw-damage-counter"><legend>Avarias</legend><label>Atual<input type="number" data-bind="system.wounds.value" /></label><span>/</span><label>Máx.<input type="number" data-bind="system.wounds.max" /></label></fieldset><div class="sw-derived sw-vehicle-stats"><div><i class="ph ph-heartbeat"></i><small>Resistência</small><b data-text="system.stats.toughness.value"></b></div><div><i class="ph ph-steering-wheel"></i><small>Manobra</small><b data-text="system.handling"></b></div><div><i class="ph ph-ruler"></i><small>Tamanho</small><b data-text="system.stats.size"></b></div></div></div><fieldset class="sw-conditions sw-vehicle-conditions"><legend>Condições</legend><div class="sw-cond-grid"><label class="sw-cond sw-cond--negative"><input type="checkbox" data-bind="system.conditions.outOfControl" /><span>Descontrolado</span></label><label class="sw-cond sw-cond--negative"><input type="checkbox" data-bind="system.conditions.wrecked" /><span>Destroçado</span></label><label class="sw-cond sw-cond--negative"><input type="checkbox" data-bind="system.conditions.onFire" /><span>Em chamas</span></label></div></fieldset><div class="sw-two sw-vehicle-details"><section class="sw-card"><h2>Estrutura</h2><div class="sw-form-grid"><label>Armadura<input type="number" data-bind="system.stats.toughness.armor" /></label><label>Tamanho<input type="number" data-bind="system.stats.size" /></label><label>Escala<input type="number" data-bind="system.stats.scale" /></label></div></section><section class="sw-card"><h2>Tripulação</h2><div class="sw-form-grid"><label>Mínima<input type="number" data-bind="system.stats.crew.min" /></label><label>Máxima<input type="number" data-bind="system.stats.crew.max" /></label></div></section></div></section>
  <section class="sw-panel" data-tab-panel="notes" hidden><section class="sw-card"><h2>Anotações</h2><div data-rich-editor="system.notes"></div></section></section>
</div>
