<div class="sw-html-sheet sw-html-sheet--group" data-sheet-type="group">
  <header class="sw-sheet-head"><div class="sw-identity"><input class="sw-name" data-bind="actor.name" placeholder="Nome do grupo" /><div class="sw-meta sw-meta--group"><label><span>Conceito</span><input data-bind="system.concept" /></label><label><span>Tamanho</span><input type="number" data-bind="system.size" /></label></div></div><div class="sw-image sw-image--token" data-actor-image="token"></div></header>
  <nav class="sw-tabs" role="tablist"><button type="button" data-tab="summary">Principal</button><button type="button" data-tab="notes">Anotações</button></nav>
  <section class="sw-panel" data-tab-panel="summary"><div class="sw-group-dashboard"><section class="sw-card sw-group-resource"><h2>Recursos</h2><div class="sw-resource-pair"><label>Atual<input type="number" data-bind="system.resources.value" /></label><span>/</span><label>Máximo<input type="number" data-bind="system.resources.max" /></label></div><div class="sw-resource-bar" aria-hidden="true"><span></span></div></section><section class="sw-card sw-group-profile"><h2>Perfil da unidade</h2><div class="sw-group-emblem"><i class="ph ph-users-three"></i><div><b data-text="actor.name"></b><small>Aliados, tropas ou organização</small></div></div><p>Gerencie o efetivo abstrato do grupo como um único recurso durante a cena.</p></section></div></section>
  <section class="sw-panel" data-tab-panel="notes" hidden><section class="sw-card"><h2>Anotações</h2><div data-rich-editor="system.notes"></div></section></section>
</div>
