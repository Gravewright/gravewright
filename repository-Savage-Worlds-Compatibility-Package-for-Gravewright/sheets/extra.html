<div class="sw-html-sheet sw-html-sheet--extra" data-sheet-type="extra">
  <header class="sw-sheet-head"><div class="sw-identity"><input class="sw-name" data-bind="actor.name" placeholder="Nome" /><div class="sw-meta sw-meta--extra"><label><span>Ancestralidade</span><input data-bind="system.ancestry" /></label><label><span>Conceito</span><input data-bind="system.concept" /></label><label><span>Estágio</span><select data-bind="system.rank"><option value="novice">Novato</option><option value="seasoned">Experiente</option><option value="veteran">Veterano</option><option value="heroic">Heroico</option><option value="legendary">Lendário</option></select></label><label><span>Avanços</span><input type="number" data-bind="system.advances" /></label></div></div><div class="sw-image sw-image--token" data-actor-image="token"></div></header>
  <nav class="sw-tabs" role="tablist"><button type="button" data-tab="summary">Principal</button><button type="button" data-tab="edges">Vantagens</button><button type="button" data-tab="inventory">Inventário</button><button type="button" data-tab="powers">Poderes</button><button type="button" data-tab="about">Sobre</button></nav>
  <section class="sw-panel" data-tab-panel="summary"><div class="sw-vitals"><fieldset class="sw-track"><legend>Recursos</legend><div class="sw-track-row"><span>Ferimentos</span><div class="sw-pips" data-sw-pips="wounds"></div></div><div class="sw-track-row"><span>Fadiga</span><div class="sw-pips" data-sw-pips="fatigue"></div></div></fieldset><fieldset class="sw-derived-strip"><legend>Derivados</legend><div class="sw-derived sw-derived--extra"><div><i class="ph ph-shield"></i><small>Aparar</small><b data-text="system.stats.parry.value"></b></div><div><i class="ph ph-heartbeat"></i><small>Resistência</small><b data-text="system.stats.toughness.value"></b></div><div><i class="ph ph-boot"></i><small>Movimentação</small><b data-text="system.stats.pace.value"></b></div></div></fieldset></div><div class="sw-summary-grid"><section class="sw-card sw-attributes-card"><div class="sw-card-heading"><h2>Atributos</h2><button type="button" data-sw-edit-attributes>Editar</button></div><div data-sw-attribute-cards></div></section><section class="sw-card"><h2>Perícias</h2><div class="sw-skill-table-head"><span>Perícia</span><span>Atributo</span><span>Dado</span><span>Mod.</span><span></span></div><div data-sw-skill-rows></div><div class="sw-skill-drop">Arraste uma perícia para adicionar</div></section></div></section>
  <section class="sw-panel sw-two" data-tab-panel="edges" hidden><section class="sw-card"><h2>Vantagens</h2><div data-item-list="system.edges"></div></section><section class="sw-card"><h2>Complicações</h2><div data-item-list="system.hindrances"></div></section></section>
  <section class="sw-panel" data-tab-panel="inventory" hidden><section class="sw-card"><h2>Armas</h2><div data-item-list="system.weapons" data-item-actions='[{"action":"item.describe","label":"Mostrar no chat","labelKey":"savage-worlds.ui.mostrar"}]'></div></section><section class="sw-card"><h2>Proteção</h2><div data-item-list="system.protection"></div></section><section class="sw-card"><h2>Equipamento</h2><div data-item-list="system.gear"></div></section></section>
  <section class="sw-panel" data-tab-panel="powers" hidden><section class="sw-card"><h2>Poderes</h2><div data-item-list="system.powers" data-item-actions='[{"action":"item.describe","label":"Mostrar no chat","labelKey":"savage-worlds.ui.mostrar"}]'></div></section></section>
  <section class="sw-panel" data-tab-panel="about" hidden><section class="sw-card"><h2>História</h2><div data-rich-editor="system.bio"></div></section><section class="sw-card"><h2>Anotações</h2><div data-rich-editor="system.notes"></div></section></section>
</div>
