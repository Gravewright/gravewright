<form class="gw-my-rpg-sheet" data-sheet-type="star-ship">
  <header class="gw-my-rpg-sheet__header">
    <label>
      Name
      <input data-bind="actor.name" aria-label="Star Ship name">
    </label>
    <span class="gw-my-rpg-sheet__type" data-text="actor.type"></span>
  </header>
  <section class="gw-my-rpg-sheet__panel">
    <div class="gw-my-rpg-sheet__fields">
      <label>
      Description
      <textarea data-bind="system.description"></textarea>
      </label>
    </div>
  </section>
</form>
