<form class="gw-my-rpg-sheet" data-sheet-type="character">
  <header class="gw-my-rpg-sheet__header">
    <label>
      Name
      <input data-bind="actor.name" aria-label="Character name">
    </label>
    <span class="gw-my-rpg-sheet__type" data-text="actor.type"></span>
  </header>
  <section class="gw-my-rpg-sheet__panel">
    <div class="gw-my-rpg-sheet__fields">
      <label>
      Level
      <input type="number" data-bind="system.level">
      </label>
      <label>
      Health
      <input type="number" data-bind="system.resources.health">
      </label>
      <label>
      Maximum health
      <input type="number" data-bind="system.resources.healthMax">
      </label>
      <label>
      Defense
      <input type="number" data-bind="system.defense">
      </label>
      <label>
      Speed
      <input type="number" data-bind="system.speed">
      </label>
      <label>
      Experience
      <input type="number" data-bind="system.experience">
      </label>
      <label>
      Description
      <textarea data-bind="system.description"></textarea>
      </label>
    </div>
  </section>
</form>
