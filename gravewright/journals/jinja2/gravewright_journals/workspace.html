<aside id="journals-panel" class="game-panel" data-movable style="display:none" data-show="$_journalsOpen" data-style="{'--panel-index':$_chatOpen?1:0}"><header data-move-handle><strong class="game-panel__title">{{ icon('Scroll','duotone') }}Journals</strong><div><button type="button" aria-label="Detach" title="Detach" data-journal-directory="detach">{{ icon('ArrowsOutSimple') }}</button><button type="button" aria-label="Minimize" title="Minimize" data-journal-directory="minimize">{{ icon('Minus') }}</button><button type="button" aria-label="Close" title="Close" data-journal-directory="close">{{ icon('X') }}</button></div></header><section class="journal-directory"><p data-journal-error role="alert" hidden></p><div data-v-gwtoolbar class="directory-toolbar"><div data-v-gwtoolbar class="directory-toolbar__actions"><button data-v-gwtoolbar type="button" data-journal-directory="create">{{ icon('BookOpenText') }}Create journal</button><button data-v-gwtoolbar type="button" data-journal-directory="folder">{{ icon('FolderPlus') }}Create folder</button></div><label data-v-gwtoolbar class="directory-toolbar__search">{{ icon('MagnifyingGlass',scope='data-v-gwtoolbar') }}<input data-v-gwtoolbar type="search" aria-label="Search journals" placeholder="Search journals"></label></div><div data-directory-tree class="directory-tree" data-v-gwtree></div><p class="journal-directory__empty">{{ icon('BookOpenText') }}No journals in this table.</p></section></aside>
<template id="journal-entry"><button data-v-gwentry class="directory-entry directory-entry--compact" type="button" title="Journal">{{ icon('BookOpenText') }}<span data-v-gwentry class="directory-entry__info"><strong data-v-gwentry></strong></span>{{ icon('DotsSixVertical',css='directory-entry__grip') }}</button></template>
<template id="journal-folder"><section class="gw-folder gw-folder--accent"><header class="gw-folder__header">{{ icon('DotsSixVertical',css='gw-folder__grip') }}<button class="gw-folder__toggle" type="button">{{ icon('FolderOpen',css='gw-folder__icon') }}<span class="gw-folder__label"></span><span class="gw-folder__count"></span>{{ icon('CaretRight',css='gw-folder__caret') }}</button><div class="gw-folder__actions"><button type="button" title="Create journal">{{ icon('Plus') }}</button><button type="button" title="Create subfolder" data-subfolder>{{ icon('FolderPlus') }}</button></div></header><div class="gw-folder__content"><div class="directory-tree" data-v-gwtree></div></div></section></template>
<template id="journal-create"><form data-v-gwdialog class="directory-dialog" data-movable role="dialog" aria-label="Create journal"><header data-v-gwdialog class="directory-dialog__header" data-move-handle><strong data-v-gwdialog>Create journal</strong><button data-v-gwdialog class="directory-dialog__close" type="button" aria-label="Close">{{ icon('X') }}</button></header><fieldset data-v-gwdialog class="directory-dialog__fields"><label class="journal-field">Title<input name="title" class="journal-input" maxlength="120" required autofocus></label><label class="journal-field">Type<select name="type" class="journal-input"><option value="diary">Journal</option><option value="quest">Quest</option><option value="quest_board">Quest board</option><option value="roll_table">Roll table</option></select></label><button class="journal-button" type="submit">Create journal</button><p role="alert" hidden></p></fieldset></form></template>
<template id="journal-folder-form"><form data-v-gwdialog class="directory-dialog" data-movable role="dialog" aria-label="Journal folder"><header data-v-gwdialog class="directory-dialog__header" data-move-handle><strong data-v-gwdialog>Journal folder</strong><button data-v-gwdialog class="directory-dialog__close" type="button" aria-label="Close">{{ icon('X') }}</button></header><fieldset data-v-gwdialog class="directory-dialog__fields"><label class="directory-folder-fields__field"><span>Name</span><input name="name" maxlength="60" required autofocus></label><label class="directory-folder-fields__field"><span>Color</span><span data-v-gwfolderfields class="directory-folder-fields__color"><input name="color" type="text" maxlength="7" pattern="#[0-9a-fA-F]{6}" value="#c09a5a" required><input data-v-gwfolderfields name="colorPicker" type="color" aria-label="Color" value="#c09a5a"></span></label><button class="journal-button" type="submit">Save folder</button><button class="journal-button" type="button" data-cancel>Cancel</button><p role="alert" hidden></p></fieldset></form></template>
<template id="journal-window"><article class="journal-window" data-movable role="dialog" data-journal-type="diary"><header class="journal-window__titlebar" data-move-handle><div class="journal-window__identity"><input class="journal-window__title" maxlength="120" aria-label="Journal title" required><strong data-title hidden></strong><small>Journal</small></div><span class="journal-window__save" aria-live="polite"></span><button class="journal-button" type="button" data-action="edit">{{ icon('Eye') }}<span>Read</span></button><button class="journal-button" type="button" title="Present journal" data-action="present">{{ icon('HandPointing') }}</button><button class="journal-button" type="button" title="Permissions" data-action="permissions">{{ icon('ShieldCheck') }}</button><button class="journal-button" type="button" title="Detach window" data-action="detach">{{ icon('ArrowsOutSimple') }}</button><button class="journal-button" type="button" title="Minimize" data-action="minimize">{{ icon('Minus') }}</button><button class="journal-button" type="button" title="Close journal" data-action="close">{{ icon('X') }}</button></header><div class="journal-window__error" role="alert" hidden><span></span><button class="journal-button" type="button" data-action="save">Try saving</button></div><section class="journal-window__permissions" hidden><h3>Document permissions</h3><label class="journal-field">Visibility<select class="journal-input" name="visibility"><option value="private">Private</option><option value="shared">Shared</option><option value="handout">Handout</option></select></label><div data-member-permissions style="display:contents"></div></section><form class="journal-window__permissions" data-presentation hidden><label class="journal-field">Present to<select class="journal-input" name="target"><option value="">Everyone at the table</option></select></label><button class="journal-button" type="submit">Present</button></form><div class="journal-window__body">
<div class="diary-workspace"><aside class="diary-workspace__browser"><header class="diary-workspace__browser-tools"><button type="button" class="journal-button" title="Cover" data-action="cover">{{ icon('House') }}</button><label class="diary-workspace__search">{{ icon('MagnifyingGlass') }}<input type="search" placeholder="Search pages…" aria-label="Search pages"></label><button class="journal-button" type="button" title="Filter pages" aria-expanded="false" data-action="filters">{{ icon('Funnel') }}</button><button class="journal-button" type="button" title="GM area" data-action="gm">{{ icon('LockKey') }}</button><button class="journal-button" type="button" title="Collapse pages" data-action="collapse">{{ icon('SidebarSimple') }}</button></header><div class="diary-workspace__filters" hidden>{% for kind,label in [('all','All'),('text','Text'),('image','Image'),('pdf','PDF'),('gm','GM')] %}<button class="journal-button" type="button" data-filter="{{ kind }}">{{ label }}</button>{% endfor %}</div><nav class="diary-workspace__index" aria-label="Journal pages"></nav><form class="diary-workspace__composer" hidden><input class="journal-input" maxlength="80" placeholder="Chapter name" aria-label="Chapter name" required><button class="journal-button" type="submit">Create</button></form><footer class="diary-workspace__create"><button class="journal-button" type="button" data-action="chapter">{{ icon('FolderPlus') }}New chapter</button>{% for kind,name,label in [('text','FileText','text'),('image','Image','image'),('pdf','FilePdf','PDF')] %}<button class="journal-button" type="button" aria-label="New {{ label }} page" data-add="{{ kind }}">{{ icon(name) }}</button>{% endfor %}</footer></aside><main class="diary-workspace__main"><header class="diary-workspace__toolbar"><button class="journal-button" type="button" title="Show pages" data-action="expand" hidden>{{ icon('SidebarSimple') }}</button><div class="diary-workspace__identity"><small>Journal</small><strong></strong></div><span data-page-count></span><button class="journal-button" type="button" aria-label="Previous page" data-action="prev">{{ icon('ArrowLeft') }}</button><button class="journal-button" type="button" aria-label="Next page" data-action="next">{{ icon('ArrowRight') }}</button></header><p data-upload-error role="alert" hidden></p><div class="diary-workspace__page"></div></main></div>
</div></article></template>
<template id="journal-page-link"><button class="diary-workspace__page-link" type="button"><span data-page-icon></span><span data-page-title></span>{{ icon('LockKey',css='page-lock') }}</button></template>
<template id="journal-upload"><div style="display:contents"><label class="diary-workspace__upload">{{ icon('UploadSimple') }}<span>Upload file</span><input type="file"></label></div></template>
<template id="journal-permission"><label class="journal-field"><span></span><select class="journal-input"><option value="none">No access</option><option value="read">Read access</option><option value="owner">Owner / editing</option></select></label></template>
<template id="journal-pdf"><section class="journal-pdf"><header class="journal-pdf__toolbar"><strong></strong><button class="journal-button" type="button" aria-label="Previous PDF page" data-pdf="prev">{{ icon('CaretLeft') }}</button><span data-pdf-count>1 / 0</span><button class="journal-button" type="button" aria-label="Next PDF page" data-pdf="next">{{ icon('CaretRight') }}</button><button class="journal-button" type="button" aria-label="Zoom out" data-pdf="out">{{ icon('Minus') }}</button><button class="journal-button" type="button" aria-label="Zoom in" data-pdf="in">{{ icon('Plus') }}</button><form><input class="journal-input" type="search" aria-label="Search PDF" placeholder="Search"><button class="journal-button" type="submit" aria-label="Search PDF">{{ icon('MagnifyingGlass') }}</button></form><button class="journal-button" type="button" data-pdf="match" hidden></button></header><p role="alert" hidden></p><div class="journal-pdf__canvas"></div></section></template>
<template id="journal-prompt"><form class="journal-prompt"><label><span></span><input class="journal-input" maxlength="120" required></label><button class="journal-button" type="submit">Save</button><button class="journal-button" type="button">Cancel</button></form></template>
<template id="journal-confirm"><section class="journal-prompt" role="alertdialog" aria-label="Confirm deletion"><p></p><button class="journal-button" type="button">Delete</button><button class="journal-button" type="button">Cancel</button></section></template>
<template id="journal-icons">{% for name in ['FileText','Image','FilePdf','CaretRight','Eye','PencilSimple','BookOpenText','Trash','UsersThree','Folder','NotePencil','Scroll','ListChecks','Coins','CheckCircle','Circle','Tag','PushPin','DiceFive','Kanban','FlagBanner'] %}<span data-icon="{{ name }}">{{ icon(name) }}</span>{% endfor %}</template>

{% include 'gravewright_journals/types.html' %}
<template id="journal-empty"><section class="journal-empty"><div class="journal-empty__seal">{{ icon('Feather') }}</div><p class="journal-empty__eyebrow">An unwritten chronicle</p><h2>Every legend begins with a word</h2><p class="journal-empty__description">A secret discovered, an oath sworn, a journey yet untold.<br>These pages await your tale.</p><div class="journal-empty__actions"><button class="journal-button" type="button" data-empty-page>Write the first page</button><button class="journal-button" type="button" data-empty-cover>Write an introduction</button></div></section></template>
