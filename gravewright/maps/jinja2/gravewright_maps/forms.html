<template id="map-create"><section class="directory-dialog game-scene-create table-modal-window" data-v-gwdialog data-movable data-window-key="scene-create" role="dialog" aria-label="{{ game.newScene }}">
  <header class="directory-dialog__header" data-v-gwdialog data-move-handle><strong>{{ game.newScene }}</strong><button class="directory-dialog__close" data-v-gwdialog type="button" aria-label="Close">{{ icon('X') }}</button></header>
  <div class="game-scene-create__body">
    <p>{{ game.chooseSceneSource }}</p>
    <button class="game-scene-create__option" type="button" data-map-create="empty">{{ icon('Square') }}<span><strong>{{ tr('Empty map') }}</strong><small>{{ tr('Choose a color, dimensions and whether to show the grid.') }}</small></span></button>
    <button class="game-scene-create__option" type="button" data-map-create="upload">{{ icon('UploadSimple') }}<span><strong>{{ game.uploadMap }}</strong><small>{{ game.uploadMapHint }}</small></span></button>
    <a class="game-scene-create__option" data-map-create="builder">{{ icon('PaintBrush') }}<span><strong>{{ game.mapBuilder }}</strong><small>{{ game.mapBuilderHint }}</small></span></a>
    <button class="game-scene-create__option" type="button" data-map-create="uvtt">{{ icon('UploadSimple') }}<span><strong>{{ tr('Import Universal VTT') }}</strong><small>{{ tr('Import a map image, walls, portals and lights from a .uvtt, .dd2vtt or .df2vtt file.') }}</small></span></button>
  </div>
</section></template>
<template id="map-activate"><form class="directory-dialog" data-v-gwdialog data-movable role="dialog" aria-label="{{ tr('Activate for selected players') }}">
  <header class="directory-dialog__header" data-v-gwdialog data-move-handle><strong>{{ tr('Activate for selected players') }}</strong><button class="directory-dialog__close" data-v-gwdialog type="button" aria-label="Close">{{ icon('X') }}</button></header>
  <fieldset class="directory-dialog__fields" data-v-gwdialog>
    <strong data-activation-scene></strong>
    <p>{{ tr('Select one or more players. Other players stay on their current scene.') }}</p>
    <div class="game-scene-player-choices" data-player-choices></div>
    <button type="submit" disabled>{{ tr('Activate') }}</button>
    <p role="alert" hidden></p>
  </fieldset>
</form></template>
<template id="map-empty"><form class="directory-dialog game-scene-empty" data-v-gwdialog data-movable role="dialog" aria-label="{{ tr('Empty map') }}">
  <header class="directory-dialog__header" data-v-gwdialog data-move-handle><strong>{{ tr('Empty map') }}</strong><button class="directory-dialog__close" data-v-gwdialog type="button" aria-label="Close">{{ icon('X') }}</button></header>
  <fieldset class="directory-dialog__fields" data-v-gwdialog>
    <label><span>{{ game.sceneName }}</span><input name="name" maxlength="120" required /></label>
    <label class="game-scene-empty__color"><span>{{ tr('Background color') }}</span><input name="color" type="color" value="#354b66" required /></label>
    <div class="game-scene-editor__columns">
      <label><span>{{ tr('Width (px)') }}</span><input name="width" type="number" min="1" step="1" value="1400" required /></label>
      <label><span>{{ tr('Height (px)') }}</span><input name="height" type="number" min="1" step="1" value="1400" required /></label>
    </div>
    <div class="game-scene-editor__columns">
      <label><span>{{ game.gridSize }}</span><input name="gridSize" type="number" min="1" max="10000" step="0.0001" required /></label>
      <label><span>{{ game.imageScale }}</span><input name="imageScale" type="number" min="0.01" max="100" step="0.01" required /></label>
    </div>
    <div class="game-scene-editor__columns">
      <label><span>{{ game.measureValue }}</span><input name="measureValue" type="number" min="0.0001" max="1000000" step="any" required /></label>
      <label><span>{{ game.measureUnit }}</span><input name="measureUnit" type="text" maxlength="24" placeholder="{{ game.measureUnitPlaceholder }}" /></label>
    </div>
    <div class="game-scene-editor__columns">
      <label><span>{{ game.group }}</span><select name="groupId"></select></label>
      <label><span>{{ game.visibility }}</span><select name="visibility"><option value="players">{{ game.players }}</option><option value="gm">{{ game.gmOnly }}</option></select></label>
    </div>
    <div class="game-scene-editor__grid">
      <label class="game-scene-editor__check"><input name="gridVisible" type="checkbox" />{{ game.showGrid }}</label>
      <label><span>{{ game.gridColor }}</span><input name="gridColor" type="color" /></label>
      <label class="game-scene-editor__range"><span>{{ game.gridOpacity }}</span><input name="gridOpacity" type="range" min="0" max="1" step="0.1" /><output>0.4</output></label>
    </div>
    <label class="game-scene-editor__check"><input name="activate" type="checkbox" checked />{{ tr('Activate after creation') }}</label>
    <button class="game-scene-editor__submit" type="submit">{{ icon('Plus') }}{{ tr('Create map') }}</button>
    <p role="alert" hidden></p>
  </fieldset>
</form></template>
<template id="map-upload"><form class="directory-dialog" data-v-gwdialog data-movable role="dialog" aria-label="{{ game.newScene }}"><header class="directory-dialog__header" data-v-gwdialog data-move-handle><strong data-v-gwdialog>{{ game.newScene }}</strong><button class="directory-dialog__close" data-v-gwdialog type="button" aria-label="Close">{{ icon('X') }}</button></header><fieldset class="directory-dialog__fields" data-v-gwdialog>
      <p>{{ game.sceneArchiveGrid }}</p>
      <div class="game-scene-editor__columns"><label><span>{{ game.sceneName }}</span><input name="name" required /></label><label><span>{{ game.gridSize }}</span><input name="gridSize" type="number" min="1" max="10000" step="0.0001" required /></label></div>
      <div class="game-scene-editor__columns"><label><span>{{ game.imageScale }}</span><input name="imageScale" type="number" min="0.01" max="100" step="0.01" required /></label><label><span>{{ game.measureValue }}</span><input name="measureValue" type="number" min="0.0001" max="1000000" step="any" required /></label></div>
      <label><span>{{ game.measureUnit }}</span><input name="measureUnit" type="text" maxlength="24" placeholder="{{ game.measureUnitPlaceholder }}" /></label>
      <label><span>{{ game.mapImage }}</span><button class="game-scene-editor__file" type="button"><b>{{ game.chooseMap }}</b><em>{{ game.noFile }}</em></button><input name="map" class="game-directory__file" type="file" accept="image/jpeg,image/png,image/webp,image/tiff" /></label>
      <div class="game-scene-editor__columns"><label><span>{{ game.group }}</span><select name="groupId"></select></label><label><span>{{ game.visibility }}</span><select name="visibility"><option value="players">{{ game.players }}</option><option value="gm">{{ game.gmOnly }}</option></select></label></div>
      <div class="game-scene-editor__grid"><label class="game-scene-editor__check"><input name="gridVisible" type="checkbox" />{{ game.showGrid }}</label><label><span>{{ game.gridColor }}</span><input name="gridColor" type="color" /></label><label class="game-scene-editor__range"><span>{{ game.gridOpacity }}</span><input name="gridOpacity" type="range" min="0" max="1" step="0.1" /><output>0.4</output></label></div>
      <label class="game-scene-editor__check"><input name="activate" type="checkbox" />{{ game.activateAfterUpload }}</label>
      <button class="game-scene-editor__submit" type="submit">{{ icon('UploadSimple') }}<span data-upload-label>{{ game.sendMap }}</span></button>
<p role="alert" hidden></p></fieldset></form></template>
<template id="map-settings"><form data-movable data-window-key="scene-settings" class="game-scene-settings table-modal-window" role="dialog" aria-label="Edit scene">
<header data-move-handle><strong><span data-settings-title></span></strong><button type="button" data-close aria-label="Close">{{ icon('X') }}</button></header>
<div class="table-modal-body">
<div class="scene-settings-columns">
<section class="scene-settings-column">
<label><span>{{ game.sceneName }}</span><input name="name" required maxlength="120" /></label>
<label><span>{{ game.imageScale }}</span><input name="imageScale" type="number" min="0.01" max="100" step="0.01" /></label>
<div class="game-scene-settings__wide"><label><span>{{ game.group }}</span><select name="groupId"><option value="">{{ game.noGroup }}</option></select></label><label><span>{{ game.visibility }}</span><select name="visibility"><option value="players">{{ game.players }}</option><option value="gm">{{ game.gmOnly }}</option></select></label></div>
<label>{{ 'Modo de visão' if language.id == 'pt-BR' else 'Vision mode' }}<select name="lightingMode"><option value="none">{{ 'Visão livre' if language.id == 'pt-BR' else 'Full vision' }}</option><option value="dynamic">{{ 'Iluminação dinâmica' if language.id == 'pt-BR' else 'Dynamic lighting' }}</option><option value="manual">{{ 'Iluminação manual' if language.id == 'pt-BR' else 'Manual lighting' }}</option></select></label>
<p data-view-hint></p><button type="button" data-current-view>{{ icon('Crosshair') }}{{ game.useCurrentView }}</button><p role="status" data-view-status hidden></p>
<label>{{ 'Escuridão' if language.id == 'pt-BR' else 'Darkness' }}<input name="darkness" type="range" min="0" max="1" step="0.05"><output data-darkness-value></output></label>
<label class="game-scene-editor__check"><input name="lightsOut" type="checkbox">{{ 'Luzes da cena apagadas' if language.id == 'pt-BR' else 'Scene lights off' }}</label>
</section>
<section class="scene-settings-column">
<label><span>{{ game.gridSize }}</span><input name="gridSize" type="number" min="1" max="10000" step="0.0001" /></label>
<div class="game-scene-settings__wide"><label><span>{{ game.measureValue }}</span><input name="measureValue" type="number" min="0.0001" max="1000000" step="any" required /></label><label><span>{{ game.measureUnit }}</span><input name="measureUnit" type="text" maxlength="24" placeholder="{{ game.measureUnitPlaceholder }}" /></label></div>
<section class="game-scene-settings__calibration"><div><strong>{{ game.gridCalibration }}</strong><small>{{ game.gridCalibrationHint }}</small></div><button type="button" data-calibrate>{{ icon('GridFour') }}{{ game.mapGrid }}</button></section>
<section class="game-scene-settings__grid"><label class="game-scene-editor__check"><input name="gridVisible" type="checkbox" />{{ game.showGrid }}</label><label><span>{{ game.gridColor }}</span><input name="gridColor" type="color" /></label><label class="game-scene-editor__range"><span>{{ game.gridOpacity }}</span><input name="gridOpacity" type="range" min="0" max="1" step="0.1" /><output>0.4</output></label></section>
</section>
</div>
<p role="alert" hidden></p>
</div>
<footer class="game-scene-settings__actions"><button type="button" data-cancel>Cancel</button><button class="game-scene-settings__save" type="submit">{{ icon('FloppyDisk') }}{{ game.saveScene }}</button></footer>
</form></template>
