<template id="map-upload"><form class="directory-dialog" data-v-gwdialog data-movable role="dialog" aria-label="{{ game.newScene }}"><header class="directory-dialog__header" data-v-gwdialog data-move-handle><strong data-v-gwdialog>{{ game.newScene }}</strong><button class="directory-dialog__close" data-v-gwdialog type="button" aria-label="Close">{{ icon('X') }}</button></header><fieldset class="directory-dialog__fields" data-v-gwdialog>
      <p>{{ game.sceneArchiveGrid }}</p>
      <div class="game-scene-editor__columns"><label><span>{{ game.sceneName }}</span><input name="name" required /></label><label><span>{{ game.gridSize }}</span><input name="gridSize" type="number" min="1" max="10000" step="0.0001" required /></label></div>
      <div class="game-scene-editor__columns"><label><span>{{ game.imageScale }}</span><input name="imageScale" type="number" min="0.01" max="100" step="0.01" required /></label><label><span>{{ game.measureValue }}</span><input name="measureValue" type="number" min="0.0001" max="1000000" step="any" required /></label></div>
      <label><span>{{ game.measureUnit }}</span><input name="measureUnit" type="text" maxlength="24" placeholder="{{ game.measureUnitPlaceholder }}" /></label>
      <label><span>{{ game.mapImage }}</span><button class="game-scene-editor__file" type="button"><b>{{ game.chooseMap }}</b><em>{{ game.noFile }}</em></button><input name="map" class="game-directory__file" type="file" accept="image/jpeg,image/png,image/webp,image/tiff" /></label>
      <div class="game-scene-editor__columns"><label><span>{{ game.group }}</span><select name="groupId"></select></label><label><span>{{ game.visibility }}</span><select name="visibility"><option value="players">{{ game.players }}</option><option value="gm">{{ game.gmOnly }}</option></select></label></div>
      <div class="game-scene-editor__grid"><label class="game-scene-editor__check"><input name="gridVisible" type="checkbox" />{{ game.showGrid }}</label><label><span>{{ game.gridColor }}</span><input name="gridColor" type="color" /></label><label class="game-scene-editor__range"><span>{{ game.gridOpacity }}</span><input name="gridOpacity" type="range" min="0" max="1" step="0.1" /><output>0.4</output></label></div>
      <label class="game-scene-editor__check"><input name="activate" type="checkbox" />{{ game.activateAfterUpload }}</label>
      <button class="game-scene-editor__submit" type="submit">{{ icon('UploadSimple') }}<span data-upload-label>{{ game.sendMap }}</span></button>
<p role="alert" hidden></p></fieldset></form></template>
<template id="map-settings"><form data-movable class="game-scene-settings" role="dialog" aria-label="Edit scene">
      <header data-move-handle><strong><span data-settings-title></span></strong><button type="button" aria-label="Close">{{ icon('X') }}</button></header>
      <div class="game-scene-settings__wide"><label><span>{{ game.sceneName }}</span><input name="name" required maxlength="120" /></label><label><span>{{ game.group }}</span><select name="groupId"><option value="">{{ game.noGroup }}</option></select></label></div>
      <div class="game-scene-settings__triple"><label><span>{{ game.visibility }}</span><select name="visibility"><option value="players">{{ game.players }}</option><option value="gm">{{ game.gmOnly }}</option></select></label><label><span>{{ game.gridSize }}</span><input name="gridSize" type="number" min="1" max="10000" step="0.0001" /></label><label><span>{{ game.imageScale }}</span><input name="imageScale" type="number" min="0.01" max="100" step="0.01" /></label></div>
      <div class="game-scene-settings__wide"><label><span>{{ game.measureValue }}</span><input name="measureValue" type="number" min="0.0001" max="1000000" step="any" required /></label><label><span>{{ game.measureUnit }}</span><input name="measureUnit" type="text" maxlength="24" placeholder="{{ game.measureUnitPlaceholder }}" /></label></div>
      <section class="game-scene-settings__calibration"><div><strong>{{ game.gridCalibration }}</strong><small>{{ game.gridCalibrationHint }}</small></div><button type="button" data-calibrate>{{ icon('GridFour') }}{{ game.mapGrid }}</button></section>
      <section class="game-scene-settings__grid"><label class="game-scene-editor__check"><input name="gridVisible" type="checkbox" />{{ game.showGrid }}</label><label><span>{{ game.gridColor }}</span><input name="gridColor" type="color" /></label><label class="game-scene-editor__range"><span>{{ game.gridOpacity }}</span><input name="gridOpacity" type="range" min="0" max="1" step="0.1" /><output>0.4</output></label></section>
      <div class="game-scene-settings__actions"><button class="game-scene-settings__save" type="submit">{{ icon('FloppyDisk') }}{{ game.saveScene }}</button><button type="button" data-current-view>{{ icon('Crosshair') }}{{ game.useCurrentView }}</button></div>
<p role="alert" hidden></p></form></template>
