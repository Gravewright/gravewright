<template id="map-calibration"><div style="display:contents"><svg class="grid-calibration" aria-label="Mark grid cells"><g></g></svg><section class="grid-calibration-panel" role="dialog" aria-label="Grid calibration"><header>{{ icon('GridFour') }}<strong>Grid calibration</strong><b>0 / 3</b><button type="button" aria-label="Cancel calibration" data-calibration="cancel">{{ icon('X') }}</button></header><p aria-live="polite"></p><div class="grid-calibration-panel__progress" aria-hidden="true"><i></i><i></i><i></i></div><small>Drag to outline a whole cell. Wheel: zoom · Right button: pan map.</small><div class="grid-calibration-panel__result" hidden><span>Cell <strong data-cell></strong></span><span>Origin <strong data-origin></strong></span></div><p class="grid-calibration-panel__error" role="alert" hidden></p><footer><button type="button" data-calibration="undo">{{ icon('ArrowCounterClockwise') }}Undo</button><button type="button" data-calibration="cancel">Cancel</button><button type="button" data-calibration="apply">{{ icon('Check') }}Apply</button></footer></section></div></template>
