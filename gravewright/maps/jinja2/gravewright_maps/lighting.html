<template id="map-visibility">
<aside class="game-panel game-panel--visibility" data-movable data-window-top-boundary=".game-menubar" aria-label="{{ tr('Visibility') }}">
  <header data-move-handle>
    <strong class="game-panel__title">{{ icon('Eye','duotone') }}<span data-visibility-text="Visibility">{{ tr('Visibility') }}</span></strong>
    <div>
      <button data-visibility-action="detach" aria-label="{{ tr('Detach') }}" title="{{ tr('Detach') }}">{{ icon('ArrowsOutSimple') }}</button>
      <button data-visibility-action="minimize" aria-label="{{ tr('Minimize') }}" title="{{ tr('Minimize') }}">{{ icon('Minus') }}</button>
      <button data-visibility-action="close" aria-label="{{ tr('Close') }}" title="{{ tr('Close') }}">{{ icon('X') }}</button>
    </div>
  </header>
  <div class="visibility-panel">
    <p role="alert" hidden></p>
    <fieldset>
      <div class="visibility-panel__modes" role="group" aria-label="{{ tr('Mode') }}" data-visibility-aria="Mode">
        {% for mode,name,symbol in [('none','Full vision','Sun'),('dynamic','Dynamic lighting','LightbulbFilament'),('manual','Manual lighting','Cloud')] %}
        <button data-mode="{{ mode }}">{{ icon(symbol) }}<span data-visibility-text="{{ name }}">{{ tr(name) }}</span></button>
        {% endfor %}
      </div>
      <p class="visibility-panel__hint" data-mode-hint></p>
      <section class="visibility-panel__section" data-mode-section="dynamic">
        <label class="visibility-panel__slider"><span><span data-visibility-text="Darkness">{{ tr('Darkness') }}</span><output></output></span><input name="darkness" type="range" min="0" max="1" step="0.05"></label>
        <small data-visibility-text="How dark the map becomes when lights are off. Does not affect full vision mode.">{{ tr('How dark the map becomes when lights are off. Does not affect full vision mode.') }}</small>
        <p class="visibility-panel__label" data-visibility-text="Scene light">{{ tr('Scene light') }}</p>
        <div class="visibility-panel__row">
          <button data-lights="on">{{ icon('Lightbulb') }}<span data-visibility-text="On">{{ tr('On') }}</span></button>
          <button data-lights="off">{{ icon('LightbulbFilament') }}<span data-visibility-text="Off">{{ tr('Off') }}</span></button>
        </div>
        <small data-visibility-text="Toggle the light without losing the darkness level set above.">{{ tr('Toggle the light without losing the darkness level set above.') }}</small>
      </section>
      <section class="visibility-panel__section" data-mode-section="manual">
        <p data-fog-status></p>
        <div data-fog-disabled style="display:contents">
          <strong data-visibility-text="Initial state">{{ tr('Initial state') }}</strong>
          <div class="visibility-panel__row">
            <button data-fog-action="enable" data-value="hide_all">{{ icon('EyeSlash') }}<span data-visibility-text="Hide all">{{ tr('Hide all') }}</span></button>
            <button data-fog-action="enable" data-value="reveal_all">{{ icon('Eye') }}<span data-visibility-text="Reveal all">{{ tr('Reveal all') }}</span></button>
          </div>
        </div>
        <div data-fog-enabled style="display:contents">
          <button data-fog-action="disable">{{ icon('Power') }}<span data-visibility-text="Disable manual lighting">{{ tr('Disable manual lighting') }}</span></button>
          <div class="visibility-panel__section">
            <strong data-visibility-text="Mode">{{ tr('Mode') }}</strong>
            <div class="visibility-panel__row">
              <button data-brush="reveal">{{ icon('Eraser') }}<span data-visibility-text="Reveal">{{ tr('Reveal') }}</span></button>
              <button data-brush="hide">{{ icon('PaintBrush') }}<span data-visibility-text="Hide">{{ tr('Hide') }}</span></button>
            </div>
          </div>
          <strong data-visibility-text="Shape">{{ tr('Shape') }}</strong>
          <div class="visibility-panel__row">
            {% for shape,name,symbol in [('circle','Circle','Circle'),('square','Square','Square'),('polygon','Polygon','Polygon')] %}
            <button data-shape="{{ shape }}">{{ icon(symbol) }}<span data-visibility-text="{{ name }}">{{ tr(name) }}</span></button>
            {% endfor %}
          </div>
          <label class="visibility-panel__slider" data-brush-size><span><span data-visibility-text="Brush size (cells)">{{ tr('Brush size (cells)') }}</span><output></output></span><input name="size" type="range" min="1" max="40" step="1"></label>
          <small data-brush-hint>{{ tr('Alt+scroll on the map to adjust quickly.') }}</small>
          <label class="visibility-panel__slider"><span><span data-visibility-text="Your fog opacity">{{ tr('Your fog opacity') }}</span><output></output></span><input name="opacity" type="range" min="0.1" max="1" step="0.05"></label>
          <small data-visibility-text="Only affects how you see fog. Fog is always opaque for players.">{{ tr('Only affects how you see fog. Fog is always opaque for players.') }}</small>
          <div class="visibility-panel__row visibility-panel__section">
            <button data-fog-action="reset" data-value="hide_all">{{ icon('EyeSlash') }}<span data-visibility-text="Hide all">{{ tr('Hide all') }}</span></button>
            <button data-fog-action="reset" data-value="reveal_all">{{ icon('Eye') }}<span data-visibility-text="Reveal all">{{ tr('Reveal all') }}</span></button>
          </div>
        </div>
      </section>
    </fieldset>
  </div>
</aside>
</template>
<template id="map-light-picker"><section class="light-picker" role="dialog" aria-label="Light types"><div class="light-picker__preview" role="img"><canvas width="430" height="123"></canvas><span></span></div><header class="light-picker__header">{{ icon('Lightbulb') }}<strong>Lighting</strong><button aria-label="Close picker">{{ icon('X') }}</button></header><div class="light-picker__options"></div></section></template>
<template id="map-light-editor"><section class="gw-window light-editor" data-movable role="dialog" aria-label="Light source"><header class="light-editor__header" data-move-handle><strong>Light source</strong><button aria-label="Close">{{ icon('X') }}</button></header><div class="light-editor__body">{% for key,label,minimum,maximum,step in [('bright_radius','Bright radius',0,30,0.5),('dim_radius','Dim radius',0,60,0.5),('intensity','Intensity',0,1,0.05),('angle','Cover',5,360,5),('rotation','Direction',0,355,5)] %}<label class="light-editor__field" data-range="{{ key }}"><span>{{ label }}</span><div class="light-editor__slider"><input name="{{ key }}" type="range" min="{{ minimum }}" max="{{ maximum }}" step="{{ step }}"><output></output></div></label>{% if key=='dim_radius' %}<label class="light-editor__check"><input name="unlimited" type="checkbox">Unlimited</label>{% endif %}{% endfor %}<div class="light-editor__pair"><label class="light-editor__field"><span>Animation</span><select name="animation"><option value="none">Steady</option><option value="torch">Torch</option><option value="pulse">Pulse</option></select></label><label class="light-editor__field"><span>Color</span><input name="color" type="color"></label></div><label class="light-editor__check"><input name="enabled" type="checkbox">On</label><small>Radii use grid cells. Walls block light.</small><p role="alert" hidden></p><footer><span role="status">Changes saved automatically</span><button>{{ icon('Trash') }}Remove</button></footer></div></section></template>
<template id="map-light-clear"><section class="gw-window scene-sources__confirm" role="alertdialog" aria-label="Clear scene lights"><strong>Clear all lights from this scene?</strong><p>Light sources will be removed.</p><div><button>Cancel</button><button>{{ icon('Trash') }}Clear lights</button></div></section></template>
