<template id="map-wall-picker"><section class="wall-picker" role="dialog" aria-label="Wall types"><div class="wall-picker__preview"><svg viewBox="0 0 430 123" aria-hidden="true"><path d="M0 41H430 M0 82H430 M86 0V123 M172 0V123 M258 0V123 M344 0V123" stroke="#ffffff0d"/><path data-wall-line stroke-width="5"/><path data-wall-bars d="M203 21H227 M203 48H227 M203 75H227 M203 102H227" stroke-width="2"/><path data-wall-beam d="M89 61L300 21V102Z" fill="#e8c574"/><circle class="wall-picker__token" cx="89" cy="61" r="8" fill="#e1d8c6"/><circle cx="215" cy="16" r="3" fill="#e1d8c6"/><circle cx="215" cy="107" r="3" fill="#e1d8c6"/></svg><span></span></div><header class="wall-picker__header">{{ icon('LineSegment') }}<strong>Walls</strong><button aria-label="Close picker">{{ icon('X') }}</button></header><div class="wall-picker__options"></div></section></template>
<template id="map-wall-editor"><section class="wall-editor gw-window" data-movable role="dialog" aria-label="Configure wall"><header class="wall-editor__header" data-move-handle><strong>Configure wall</strong><button aria-label="Close editor">{{ icon('X') }}</button></header><form class="wall-editor__body"><fieldset><label>Type<select name="preset"></select></label><div class="wall-editor__channels">{% for key,label in [('movement','Movement'),('vision','Vision'),('light','Light'),('sound','Sound')] %}<label>{{ label }}<select name="{{ key }}"><option value="block">Block</option><option value="pass">Allow</option>{% if key=='sound' %}<option value="attenuate">Attenuate</option>{% endif %}</select></label>{% endfor %}</div><label class="wall-editor__check"><input name="finite" type="checkbox">Limit by elevation</label><div class="wall-editor__channels" data-finite><label>Lower height<input name="bottom" type="number" step="any" required></label><label>Upper height<input name="top" type="number" step="any" required></label></div><small data-finite>Uses token elevation units. Outside this range, the wall does not block.</small><label class="wall-editor__check" data-secret><input name="discovered" type="checkbox">Revealed to players</label><p role="alert" hidden></p><footer><button type="submit">{{ icon('FloppyDisk') }}Save</button></footer></fieldset></form></section></template>
<template id="map-layer-icons">{% for name in ['Flame','Waveform','LineSegment','EyeSlash','Steps','Square','GridFour','Prohibit','PencilSimple','Door','Lock','Scissors','Copy','Clipboard','Trash','X','Sun','Moon','Lightbulb','CircleHalf','Eye','EyeSlash'] %}<span data-icon="{{ name }}">{{ icon(name) }}</span>{% endfor %}</template>
<template id="map-layer-confirm"><section class="wall-workspace__confirm" role="dialog"><strong></strong><p>This action cannot be undone.</p><button>Cancel</button><button>Clear</button></section></template>
