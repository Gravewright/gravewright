<template id="system-sheet-body">
      <gravewright-pdf-system-sheet
        ><div class="pdf-sheet">
          <div class="pdf-sheet__loading">Opening character sheet…</div>
          <div class="pdf-sheet__error" role="alert" hidden>
            <span></span>
            <button type="button" data-pdf="save">Try saving</button>
          </div>
          <nav class="pdf-sheet__tabs" role="tablist">
            {% for id,label,glyph in [('ficha','Character
            sheet','FilePdf'),('token','Token','UserFocus'),('notas','Notes','Notebook')]
            %}<button
              type="button"
              class="pdf-sheet__tab"
              role="tab"
              data-tab="{{ id }}"
            >
              {{ icon(glyph) }}<span>{{ label }}</span></button
            >{% endfor %}
          </nav>
          <section class="pdf-sheet__panel" data-panel="ficha">
            <header class="pdf-sheet__bar">
              <div class="pdf-sheet__bar-group">
                <button
                  class="pdf-sheet__btn"
                  type="button"
                  title="Previous page"
                  data-pdf="prevPage"
                >
                  {{ icon('ArrowLeft') }}</button
                ><span class="pdf-sheet__page">-</span
                ><button
                  class="pdf-sheet__btn"
                  type="button"
                  title="Next page"
                  data-pdf="nextPage"
                >
                  {{ icon('ArrowRight') }}
                </button>
              </div>
              <div class="pdf-sheet__bar-group">
                {% for action,label,glyph in [('out','Zoom
                out','MagnifyingGlassMinus'),('in','Zoom
                in','MagnifyingGlassPlus'),('fitPage','Fit','CornersIn'),('toggleSpread','Two-page
                view','BookOpen')] %}<button
                  class="pdf-sheet__btn"
                  type="button"
                  title="{{ label }}"
                  data-pdf="{{ action }}"
                >
                  {{ icon(glyph) }}</button
                >{% endfor %}
              </div>
              <div class="pdf-sheet__bar-group pdf-sheet__bar-group--end">
                <span class="pdf-sheet__status" role="status" aria-live="polite"></span>
                <button class="pdf-sheet__btn pdf-sheet__map-toggle" type="button" data-pdf-library-open hidden>Mapping library</button>
                <button class="pdf-sheet__btn" type="button" data-pdf-diagnostics-open title="PDF mapping diagnostics" hidden>{{ icon('MagnifyingGlass') }}</button>
                <button class="pdf-sheet__btn pdf-sheet__map-toggle" type="button" data-pdf="toggleMapping" aria-pressed="false" hidden>
                  {{ icon('Rectangle') }}<span data-pdf-map-toggle-label>Map fields</span>
                </button>
                <div class="pdf-sheet__picker-wrap">
                  <button
                    class="pdf-sheet__btn"
                    type="button"
                    title="Choose PDF"
                    data-pdf="togglePicker"
                  >
                    {{ icon('FilePdf') }}
                  </button>
                  <div class="pdf-sheet__picker" role="listbox" hidden>
                    <div data-pdf-sources></div>
                    {% if owner %}<label class="pdf-sheet__picker-upload"
                      ><input
                        type="file"
                        accept="application/pdf"
                        hidden
                        data-upload="pdf"
                      /><span>Upload PDF…</span></label
                    >{% endif %}
                  </div>
                </div>
                <button
                  class="pdf-sheet__btn"
                  type="button"
                  title="Download original PDF"
                  data-pdf="download"
                >
                  {{ icon('DownloadSimple') }}
                </button>
                <button class="pdf-sheet__btn pdf-sheet__map-toggle" type="button" data-pdf="downloadFilled" title="Download a flattened PDF copy with the current field values">Filled PDF</button>
              </div>
            </header>
            <p class="pdf-sheet__hint pdf-sheet__mapping-hint" data-pdf-unmapped hidden>This PDF has no form fields. Use Map fields to add editable areas.</p>
            <p class="pdf-sheet__hint pdf-sheet__mapping-hint" data-pdf-actions-hint hidden>Double-click a field to link a token value or configure a roll. You can also focus a field and press F2.</p>
            <div class="pdf-sheet__roll-actions" data-pdf-rolls role="group" aria-label="Field rolls" hidden></div>
            <div class="pdf-sheet__mapping-tools" data-pdf-mapping-tools hidden>
              <label><span>Field type</span><select class="pdf-sheet__select" data-pdf-map-tool>
                <option value="select">Select fields</option>
                <option value="text">Text field</option>
                <option value="number">Number field</option>
                <option value="checkbox">Checkbox</option>
                <option value="multiline">Multiline text</option>
              </select></label>
              <button type="button" data-pdf-map-add>Add field</button>
              <p data-pdf-map-help>Choose a field type and drag a rectangle on the page. Select a field to move, resize or rename it.</p>
              <div class="pdf-sheet__map-properties" data-pdf-map-properties hidden>
                <label><span>Field name</span><input type="text" maxlength="120" required data-pdf-map-name translate="no"></label>
                {% for key,label in [('x','Left (%)'),('y','Top (%)'),('width','Width (%)'),('height','Height (%)')] %}
                <label><span>{{ label }}</span><input type="number" min="{{ '0' if key in ['x','y'] else '0.1' }}" max="100" step="0.1" required data-pdf-map-property="{{ key }}"></label>
                {% endfor %}
                <button type="button" data-pdf-map-delete>Delete field</button>
              </div>
              <p data-pdf-map-error role="alert" hidden></p>
            </div>
            <section class="pdf-sheet__stage">
              <div class="pdf-sheet__empty" hidden>
                <p>No PDF selected yet.</p>
                <p class="pdf-sheet__hint">
                  Upload your PDF sheet through the Actors tab (<strong
                    >Upload template</strong
                  >) and select it using the PDF button above.
                </p>
              </div>
              <div class="pdf-sheet__doc">
                <div class="pdf-sheet__page-host"></div>
                <div class="pdf-sheet__fields"></div>
                <div class="pdf-sheet__mapping" hidden></div>
              </div>
            </section>
          </section>
          <section
            class="pdf-sheet__panel pdf-sheet__panel--form"
            data-panel="token"
            hidden
          >
            <div class="pdf-sheet__images">
              {% for kind,label in [('portrait','Portrait'),('token','Token
              image')] %}<label class="pdf-sheet__image-picker"
                ><span>{{ label }}</span
                ><img alt="" data-image="{{ kind }}" hidden /><span
                  class="pdf-sheet__image-action"
                  data-image-action="{{ kind }}"
                  >{{ icon('UploadSimple') }} Choose image</span
                ><input
                  type="file"
                  hidden
                  accept="image/png,image/jpeg,image/webp"
                  data-upload="{{ kind }}" /></label
              >{% endfor %}
            </div>
            <div class="pdf-sheet__field-group">
              <h3>Token name</h3>
              <label class="pdf-sheet__row"
                ><span>Name</span
                ><input class="pdf-sheet__text" type="text" data-field="name"
              /></label>
            </div>
            {% if owner %}
            <div class="pdf-sheet__field-group">
              <h3>Token size</h3>
              <label class="pdf-sheet__row"
                ><span>Grid cells</span
                ><input
                  type="number"
                  class="pdf-sheet__text"
                  data-field="size"
                  min="1"
                  step="1"
              /></label>
            </div>
            {% endif %}
            <div class="pdf-sheet__field-group">
              <h3>Text color</h3>
              <label class="pdf-sheet__row"
                ><span>Color over the page</span
                ><input
                  class="pdf-sheet__color"
                  type="color"
                  data-field="textColor"
                  value="#111111"
              /></label>
            </div>
            <div class="pdf-sheet__field-group">
              <h3>Token bars</h3>
              <p class="pdf-sheet__hint" data-no-fields>
                Open a PDF with fields first.
              </p>
              <div class="pdf-sheet__bar-map" data-bar-choices>
                {% for key,label in [('bar1Value','Bar 1 ·
                Current'),('bar1Max','Bar 1 · Maximum'),('bar2Value','Bar 2 ·
                Current'),('bar2Max','Bar 2 ·
                Maximum'),('initiative','Initiative'),('defense','Defense')]
                %}<label class="pdf-sheet__row"
                  ><span>{{ label }}</span
                  ><select
                    class="pdf-sheet__select"
                    data-bar="{{ key }}"
                  ></select></label
                >{% endfor %}
              </div>
            </div>
          </section>
          <section
            class="pdf-sheet__panel pdf-sheet__panel--form"
            data-panel="notas"
            hidden
          >
            {% for key,label in
            [('bio','Biography'),('history','History'),('notes','Notes')] %}
            <div class="pdf-sheet__field-group">
              <h3>{{ label }}</h3>
              <div data-note="{{ key }}" aria-label="{{ label }}"></div>
            </div>
            {% endfor %}
          </section>
        </div></gravewright-pdf-system-sheet
      >

</template>
