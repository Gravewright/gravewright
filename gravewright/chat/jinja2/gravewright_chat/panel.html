<aside id="chat-panel" class="game-panel{{ ' game-panel--detached' if detached_chat else '' }}" data-movable style="--panel-index:0;display:none" data-show="$_chatOpen &amp;&amp; !$_chatDetached" data-class="{'game-panel--minimized':$_chatMinimized,'gw-window--focused':!$_chatMinimized,'gw-movable-resizable':!$_chatMinimized}">
<header data-move-handle><strong class="game-panel__title">{{ icon('ChatCircleText','duotone') }}Chat</strong><div>{% if member_role == 'gm' %}<button type="button" data-chat-clear aria-label="Clear chat history" title="Clear chat history">{{ icon('Trash') }}</button>{% endif %}<button type="button" aria-label="{{ game.detach }}" title="{{ game.detach }}" data-on:click="window.gravewrightRealtime.detach()">{{ icon('ArrowsOutSimple') }}</button><button type="button" aria-label="{{ game.minimize }}" title="{{ game.minimize }}" data-on:click="$_chatMinimized=!$_chatMinimized">{{ icon('Minus') }}</button><button type="button" aria-label="Close" title="Close" data-on:click="window.gravewrightRealtime.closeChat()">{{ icon('X') }}</button></div></header>
<div class="game-panel__chat">
<div id="chat-log" class="game-panel__log" data-show="$_hasChat" style="display:none" aria-live="polite" aria-relevant="additions"></div>
<div class="game-panel__placeholder" data-show="!$_hasChat">{{ icon('ChatCircleText') }}<strong>{{ game.chatWelcome }}</strong><p>{{ game.chatHint }}</p></div>
<div class="game-dice-tray"><button type="button" data-attr:aria-expanded="String($_diceOpen)" data-on:click="window.gravewrightDice.toggle()">{{ icon('DiceFive') }}{{ game.diceTray }}</button></div>
<form id="chat-form" data-on:submit__prevent="window.gravewrightRealtime.say($_chatDraft)"><textarea name="message" maxlength="2000" aria-label="{{ game.message }}" data-bind:_chat-draft placeholder="{{ game.message }}" data-attr:disabled="$_presence!=='seated'" data-on:keydown="if(evt.key==='Enter' &amp;&amp; !evt.shiftKey &amp;&amp; !evt.ctrlKey &amp;&amp; !evt.altKey &amp;&amp; !evt.metaKey &amp;&amp; !evt.isComposing){evt.preventDefault();window.gravewrightRealtime.say($_chatDraft)}"></textarea><p role="alert" data-show="!!$_chatError" data-text="$_chatError" style="display:none"></p><button type="submit" data-attr:disabled="$_presence!=='seated'||$_chatPending||!$_chatDraft.trim()">{{ game.send }}</button></form>
</div></aside>
