<header class="game-menubar">
<button class="game-menubar__logo" type="button" data-class="{'game-menubar__logo--on':$_house}" data-attr:aria-expanded="String($_house)" aria-label="{{ house.title }}" title="{{ house.title }}" data-on:click="$_house=!$_house"><span class="gw-mark" aria-hidden="true"></span></button>
<div class="game-menubar__brand"><strong>{{ campaign.name }}</strong><span class="game-menubar__presence" data-attr:data-presence="$_presence" data-attr:title="({{ game.presence|tojson|forceescape }})[$_presence]" data-attr:aria-label="({{ game.presence|tojson|forceescape }})[$_presence]"></span></div>
{% if owner %}<div class="game-menubar__layers" role="group" aria-label="Layers">{% for layer in layers %}<button class="game-menubar__layer" data-class="{'game-menubar__layer--on':$_layer==='{{ layer.id }}'}" type="button" data-attr:aria-pressed="String($_layer==='{{ layer.id }}')" data-on:click="$_layer='{{ layer.id }}';$_tool='select'">{{ icon(layer.icon,'duotone') }}<span>{{ layer.label }}</span></button>{% endfor %}</div>{% endif %}
<div class="game-menubar__actions">
<button class="game-menubar__library" type="button" aria-expanded="false" title="Library · Assets and cards">{{ icon('FolderOpen') }}<span>Library</span></button>
<div data-v-gwaudio class="individual-audio" role="group" aria-label="Audio on this device"><button data-v-gwaudio class="individual-audio__toggle" type="button" data-audio-control="mute" aria-label="Enable audio" title="Play audio on this device" aria-pressed="false">{{ icon('SpeakerSlash',scope='data-v-gwaudio') }}</button><input data-v-gwaudio class="individual-audio__volume" type="range" min="0" max="100" step="1" value="100" data-audio-control="volume" aria-label="Individual volume" aria-valuetext="100% — somente neste dispositivo" title="Volume individual: 100%" /><button data-v-gwaudio class="individual-audio__toggle" type="button" data-audio-control="mixer" aria-label="Individual mixer" aria-expanded="false">{{ icon('SlidersHorizontal',scope='data-v-gwaudio') }}</button></div>
<div class="game-menubar__roster"><button type="button" data-class="{'game-menubar__roster-open':$_roster}" data-attr:aria-expanded="String($_roster)" aria-label="{{ game.players }}" title="{{ game.players }}" data-on:click__stop="$_roster=!$_roster">{{ icon('UsersThree') }}<b data-show="$_onlineCount>0" data-text="$_onlineCount" style="display:none"></b></button><div class="game-roster" data-on:click__stop="void 0" data-show="$_roster" style="display:none"><p>{{ game.players }}</p><div id="table-roster" style="display:contents"><span class="game-roster__empty">{{ game.nobodyOnline }}</span></div></div></div>
<button type="button" aria-label="{{ game.leave }}" title="{{ game.leave }}" data-on:click="window.location.assign('/inside')">{{ icon('ArrowLeft') }}</button>
</div></header>
