<template id="combat-icons"><span data-combat-icon="ph-sliders-horizontal">{{ icon("SlidersHorizontal") }}</span><span data-combat-icon="ph-user-plus">{{ icon("User") }}</span><span data-combat-icon="ph-arrow-clockwise">{{ icon("ArrowClockwise") }}</span><span data-combat-icon="ph-arrow-counter-clockwise">{{ icon("ArrowCounterClockwise") }}</span><span data-combat-icon="ph-arrow-down">{{ icon("ArrowDown") }}</span><span data-combat-icon="ph-arrow-up">{{ icon("ArrowUp") }}</span><span data-combat-icon="ph-caret-left">{{ icon("CaretLeft") }}</span><span data-combat-icon="ph-caret-right">{{ icon("CaretRight") }}</span><span data-combat-icon="ph-crosshair">{{ icon("Crosshair") }}</span><span data-combat-icon="ph-dice-five">{{ icon("DiceFive") }}</span><span data-combat-icon="ph-dots-three-outline-vertical">{{ icon("DotsThreeOutlineVertical") }}</span><span data-combat-icon="ph-eye">{{ icon("Eye") }}</span><span data-combat-icon="ph-eye-slash">{{ icon("EyeSlash") }}</span><span data-combat-icon="ph-flag">{{ icon("Flag") }}</span><span data-combat-icon="ph-identification-card">{{ icon("IdentificationCard") }}</span><span data-combat-icon="ph-play">{{ icon("Play") }}</span><span data-combat-icon="ph-plus-circle">{{ icon("PlusCircle") }}</span><span data-combat-icon="ph-question">{{ icon("Question") }}</span><span data-combat-icon="ph-skull">{{ icon("Skull") }}</span><span data-combat-icon="ph-stop">{{ icon("Stop") }}</span><span data-combat-icon="ph-sword">{{ icon("Sword") }}</span><span data-combat-icon="ph-x">{{ icon("X") }}</span></template>
<template id="item-directory-icons">{% for key,glyph in [('item','Backpack'),('Backpack','Backpack'),('Sword','Sword'),('ShieldCheck','ShieldCheck'),('Scroll','Scroll'),('Sparkle','Sparkle'),('User','User'),('folder','Folder'),('caret','CaretRight'),('more','DotsThreeOutlineVertical'),('edit','PencilSimple'),('copy','Copy'),('permissions','UsersThree'),('delete','Trash'),('create','Plus'),('folder-create','FolderPlus'),('search','MagnifyingGlass'),('move','ArrowRight')] %}<span data-item-icon="{{ key }}">{{ icon(glyph) }}</span>{% endfor %}</template>
{% for name,title,glyph in [('items','Items','Backpack'),('compendiums','Compendiums','Books'),('combat','Combat','Sword')] %}
<aside id="{{ name }}-panel" class="game-panel" data-native-directory="{{ name }}" data-movable hidden data-is-gm="{{ 'true' if owner else 'false' }}">
  <header data-move-handle><strong class="game-panel__title">{{ icon(glyph,'duotone') }}{{ title }}</strong><div><button type="button" aria-label="Close {{ title }}" data-close>{{ icon('X') }}</button></div></header>
  <div class="game-directory"><p role="alert" data-error hidden></p>
  {% if name!='combat' %}
  {% if name=='items' %}<div class="directory-toolbar"><div class="directory-toolbar__actions">{% if owner %}<button type="button" data-create>{{ icon('Plus') }}Create item</button><button type="button" data-folder>{{ icon('FolderPlus') }}Create folder</button>{% endif %}</div><label class="directory-toolbar__search">{{ icon('MagnifyingGlass') }}<input type="search" aria-label="Search items" placeholder="Search items"></label></div>
  {% endif %}<div class="directory-tree" data-entries></div>
  {% else %}
  <div data-combat-state></div>

  {% endif %}
  </div>
</aside>
{% endfor %}
