<nav class="game-dock" aria-label="Table tools and directories"><div class="game-dock__row">
{% for layer in layers %}<div class="game-dock__group" role="group" aria-label="Ferramentas: {{ layer.label }}" data-show="$_layer==='{{ layer.id }}'" {% if not loop.first %}style="display:none"{% endif %}>{% for tool in tools[layer.id] %}
<button class="game-dock__item" type="button" aria-keyshortcuts="{{ tool.key }}" aria-label="{{ tool.label }}" data-dock-tool="{{ tool.id }}" {% if (layer.id=='lighting' and tool.id in ['light','clear-lights']) or (layer.id=='effects' and tool.id in ['particle','shader','clear-effects']) %}data-effect-tool="{{ tool.id }}"{% endif %}{% if tool.id in ['lighting','visibility'] %}data-map-visibility{% endif %}{% if layer.id=='walls' %}data-wall-tool="{{ tool.id }}"{% endif %} {% if layer.id=='effects' or (layer.id=='composition' and tool.id=='images') %}data-native-tool="{{ tool.id }}"{% endif %} {% if (tool.get('panel') or tool.id.startswith('clear-')) and tool.id not in ['clear-walls','clear-lights','lighting','visibility','particle','shader','clear-effects','images','cards','sound','sounds','audio'] %}aria-disabled="true" aria-pressed="false"{% elif tool.id in ['particle','shader'] %}data-class="{'game-dock__item--on':$_tool==='{{ tool.id }}'}" data-attr:aria-pressed="String($_tool==='{{ tool.id }}')" data-on:click="void 0"{% elif tool.id in ['clear-walls','clear-lights','lighting','visibility','particle','shader','clear-effects','images','cards','sound','sounds','audio'] %}aria-pressed="false" data-on:click="void 0"{% else %}data-class="{'game-dock__item--on':$_tool==='{{ tool.id }}'}" data-attr:aria-pressed="String($_tool==='{{ tool.id }}')" data-on:click="$_tool='{{ tool.id }}'"{% endif %}>{{ icon(tool.icon,'duotone') }}<span class="game-dock__tip">{{ tool.label }}<kbd>{{ tool.key }}</kbd></span></button>
{% endfor %}</div>{% endfor %}
<i class="game-dock__split" aria-hidden="true"></i>
<div class="game-dock__group" role="group" aria-label="Directories">{% for panel in directories %}<button class="game-dock__item{{ ' game-dock__guide' if owner and panel.id in ['scenes','actors'] else '' }}" type="button" data-panel="{{ panel.id }}" aria-keyshortcuts="{{ panel.key }}" aria-label="{{ panel.label }}" {% if panel.id=='chat' %}data-class="{'game-dock__item--on':$_chatOpen}" data-attr:aria-pressed="String($_chatOpen)" data-on:click="window.gravewrightRealtime.toggleChat()"{% elif panel.id=='scenes' %}data-class="{'game-dock__item--on':$_mapsOpen,'game-dock__guide':!$_mapsOpen &amp;&amp; !$_hasMap}" data-attr:aria-pressed="String($_mapsOpen)" data-on:click="window.gravewrightMaps.toggle()"{% elif panel.id=='actors' %}data-class="{'game-dock__item--on':$_actorsOpen,'game-dock__guide':!$_actorsOpen &amp;&amp; !$_hasMap}" data-attr:aria-pressed="String($_actorsOpen)" data-on:click="window.gravewrightActors.toggle()"{% elif panel.id=='journals' %}data-class="{'game-dock__item--on':$_journalsOpen}" data-attr:aria-pressed="String($_journalsOpen)" data-on:click="window.gravewrightJournals.toggle()"{% elif panel.id in ['items','combat','content'] %}aria-pressed="false" data-native-directory-toggle="{{ panel.id }}"{% else %}aria-pressed="false" aria-disabled="true"{% if panel.id=='actors' %} data-class="{'game-dock__guide':!$_hasMap}"{% endif %}{% endif %}>{{ icon(panel.icon,'duotone') }}<span class="game-dock__tip">{{ panel.label }}<kbd>{{ panel.key }}</kbd></span></button>{% endfor %}<button class="game-dock__item" type="button" aria-label="Settings" aria-keyshortcuts="S" data-attr:aria-pressed="String($_house)" data-on:click="$_house=!$_house">{{ icon('Gear') }}<span class="game-dock__tip">Settings<kbd>S</kbd></span></button></div>
</div></nav>
